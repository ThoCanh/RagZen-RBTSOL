services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - qdrant_data:/qdrant/storage

  ragzen:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      RAGZEN_API_KEY: ${RAGZEN_API_KEY:?set RAGZEN_API_KEY before starting RagZen}
    ports:
      - "8000:8000"
    volumes:
      - ragzen_data:/app/.ragzen

volumes:
  qdrant_data:
  ragzen_data:
