[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "ragzen"
version = "0.2.0"
description = "Enterprise-grade, local-first RAG for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "RagZen Contributors" },
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "enterprise",
    "multi-tenant",
    "local-first",
    "llm",
    "search",
    "embeddings",
    "vector-store",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "httpx>=0.25.0,<1.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "tenacity>=8.2.0,<10.0.0",
    "xxhash>=3.4.0,<4.0.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=2.2.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
]
documents = [
    "pypdf>=6.14.2,<7.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
]
qdrant = [
    "qdrant-client>=1.7.0,<3.0.0",
]
redis = [
    "redis>=5.0.0,<6.0.0",
]
server = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "python-multipart>=0.0.6,<1.0.0",
]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0,<2.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pip-audit>=2.6.0,<3.0.0",
    "build>=1.0.0,<2.0.0",
    "twine>=4.0.0,<6.0.0",
    "types-PyYAML>=6.0.0",
    "types-redis>=4.6.0",
    "hatchling>=1.21.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "qdrant-client>=1.7.0,<3.0.0",
    "pypdf>=6.14.2,<7.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
]
all = [
    "sentence-transformers>=2.2.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "pypdf>=6.14.2,<7.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "qdrant-client>=1.7.0,<3.0.0",
    "redis>=5.0.0,<6.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "python-multipart>=0.0.6,<1.0.0",
]

[project.scripts]
ragzen = "ragzen.cli.main:app"

[project.urls]
Homepage = "https://github.com/ThoCanh/RagZen-RBTSOL"
Documentation = "https://github.com/ThoCanh/RagZen-RBTSOL#readme"
Repository = "https://github.com/ThoCanh/RagZen-RBTSOL"
Issues = "https://github.com/ThoCanh/RagZen-RBTSOL/issues"
Changelog = "https://github.com/ThoCanh/RagZen-RBTSOL/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ragzen"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ragzen",
    "tests",
    "examples",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "ARCHITECTURE.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "THREAT_MODEL.md",
    "RELEASE.md",
    "deployment",
    "pyproject.toml",
]





[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "PLC",   # pylint convention
    "PLE",   # pylint error
    "PLW",   # pylint warning
]
ignore = [
    "S101",   # assert used (ok in tests)
    "S603",   # subprocess without shell (we never use shell=True)
    "S607",   # partial path subprocess
    "TCH001", # move import into type-checking block (we use at runtime)
    "TC001",  # move import into type-checking block (we use at runtime)
    "TC003",  # move stdlib import into type-checking block (we use at runtime)
    "PLC0415",# top-level import (used for optional extra dependencies)
    "RUF012", # mutable class var (we use ClassVar-style constants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "T20"]
"src/ragzen/cli/**/*.py" = ["T201"]
"examples/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["ragzen"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "qdrant_client.*",
    "pypdf.*",
    "docx.*",
    "openpyxl.*",
    "redis.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may need services)",
    "security: Security tests",
    "performance: Performance/benchmark tests",
    "chaos: Chaos/fault tolerance tests",
    "slow: Slow tests",
    "contract: Contract tests for provider adapters",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["ragzen"]
branch = true
omit = [
    "*/tests/*",
    "*/cli/*",
    "*/server/*",
    "*/embeddings/sentence_transformer.py",
    "*/llms/openai_compatible.py",
    "*/retrieval/rerank.py",
    "*/vectorstores/qdrant.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "@abstractmethod",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
